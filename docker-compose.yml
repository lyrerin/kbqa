name: kbqa

services:
  api:
    build: .
    container_name: enterprise-kb-api
    ports:
      - "8000:8000"
    volumes:
      - ./knowledge_docs:/app/knowledge_docs
      - ./chroma_db:/app/chroma_db
      - ./uploads:/app/uploads
      - ./.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  streamlit:
    build: .
    container_name: enterprise-kb-ui
    ports:
      - "8501:8501"
    volumes:
      - ./.env:/app/.env
    environment:
      - API_BASE=http://api:8000
    command: streamlit run streamlit_app.py --server.address=0.0.0.0
    depends_on:
      - api
    restart: unless-stopped